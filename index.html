<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SETUN LABS // Under Maintenance</title>
<meta name="description" content="Setun Labs is under maintenance. We will be back.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="theme-color" content="#0b0a09">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Setun Labs">
<meta property="og:title" content="SETUN LABS // Under Maintenance">
<meta property="og:description" content="Setun Labs is under maintenance. We will be back.">
<meta property="og:url" content="https://setunlabs.ai/">
<meta property="og:image" content="https://setunlabs.ai/og.png">
<meta name="twitter:card" content="summary_large_image">
<style>
@font-face {
  font-family: 'Share Tech Mono';
  src: url('fonts/ShareTechMono-Regular.ttf') format('truetype');
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

:root {
  --bg: #0b0a09;
  --fg: #c8b89a;
  --fg-dim: rgba(200,184,154,0.62);
  --fg-faint: rgba(200,184,154,0.34);
  --green: #60a880;
  --gold: #c8a860;
  --border: rgba(200,184,154,0.14);
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0; }

html, body { height: 100%; overflow-x: hidden; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Share Tech Mono', ui-monospace, 'Cascadia Mono', monospace;
  font-size: 15px;
  line-height: 1.65;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

::selection { background: var(--gold); color: var(--bg); }

/* ---- scanlines ---- */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 2px,
    rgba(200,184,154,0.05) 2px,
    rgba(200,184,154,0.05) 3px
  );
  opacity: 0.06;
  pointer-events: none;
  z-index: 9000;
}

a { color: var(--fg); text-decoration: none; }
a:hover { color: var(--gold); }

/* ---- status dots ---- */
.dot {
  display: inline-block;
  width: 5px; height: 5px;
  border-radius: 50%;
  margin-right: 9px;
  vertical-align: 2px;
  animation: breathe 2.6s ease-in-out infinite;
}
.dot.gold  { background: var(--gold);  box-shadow: 0 0 6px rgba(200,168,96,0.55); }
.dot.amber { background: var(--gold);  box-shadow: 0 0 6px rgba(200,168,96,0.55); }
@keyframes breathe {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.35; }
}

header {
  border-bottom: 1px solid var(--border);
  padding: 18px 24px;
}

.wordmark {
  font-size: 15px;
  letter-spacing: 3px;
  font-weight: 700;
}
.wordmark .jp {
  margin-left: 12px;
  color: var(--fg-faint);
  font-size: 12px;
  letter-spacing: 2px;
}

main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  padding: 48px 24px;
}

#sky {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}

.panel {
  position: relative;
  z-index: 1;
  max-width: 640px;
  width: 100%;
  text-align: center;
}

.kicker {
  font-size: 12px;
  letter-spacing: 3px;
  color: var(--gold);
  margin-bottom: 28px;
  animation: pulse 2.2s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.55; }
}

h1 {
  font-size: clamp(34px, 6vw, 56px);
  line-height: 1.15;
  letter-spacing: 2px;
  font-weight: 700;
  margin-bottom: 24px;
}
h1 .accent { color: var(--gold); }

.sub {
  color: var(--fg-dim);
  font-size: 15px;
  max-width: 480px;
  margin: 0 auto 20px;
}

.jp-line {
  color: var(--fg-faint);
  font-size: 13px;
  letter-spacing: 3px;
  margin-bottom: 40px;
}

.stars {
  display: flex;
  justify-content: center;
  gap: 22px;
  margin-bottom: 40px;
}
.stars span {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--fg);
  box-shadow: 0 0 8px rgba(200,184,154,0.6);
  animation: breathe 2.6s ease-in-out infinite;
}
.stars span:nth-child(2) { animation-delay: 0.6s; }
.stars span:nth-child(3) { animation-delay: 1.2s; }

.contact {
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--fg-faint);
}
.contact a { color: var(--fg-dim); border-bottom: 1px solid var(--border); }
.contact a:hover { color: var(--gold); border-bottom-color: var(--gold); }

footer {
  border-top: 1px solid var(--border);
  padding: 16px 24px;
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--fg-faint);
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
</style>
</head>
<body>

<header>
  <a class="wordmark" href="/">
    <span class="dot gold"></span>SETUN LABS
    <span class="jp">セツン・ラボ</span>
  </a>
</header>

<main>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="panel">
    <div class="kicker"><span class="dot amber"></span>UNDER MAINTENANCE // メンテナンス中</div>
    <h1>WE WILL BE <span class="accent">BACK</span>.</h1>
    <p class="sub">Setun Labs is down for maintenance.</p>
    <div class="jp-line">ただいま工事中。またすぐに戻ります。</div>
    <div class="stars" aria-hidden="true"><span></span><span></span><span></span></div>
    <p class="contact">QUESTIONS // <a href="mailto:setunlabs@gmail.com">SETUNLABS@GMAIL.COM</a></p>
  </div>
</main>

<footer>
  <span>SETUN LABS ⬢ SETUNLABS.AI</span>
  <span>© 2026 // ALL SIGNALS LOCAL</span>
</footer>

<script>
// Three stars, one line — Orion's Belt over a quiet sky.
(function () {
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resize() {
    canvas.width = canvas.clientWidth * devicePixelRatio;
    canvas.height = canvas.clientHeight * devicePixelRatio;
    seed();
  }

  function seed() {
    stars = [];
    const n = Math.floor((canvas.width * canvas.height) / 14000);
    for (let i = 0; i < n; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: (Math.random() * 0.9 + 0.3) * devicePixelRatio,
        p: Math.random() * Math.PI * 2,
        s: 0.4 + Math.random() * 0.8
      });
    }
    // the belt: three stars in a line, slightly tilted
    const cx = canvas.width / 2, cy = canvas.height * 0.32;
    const gap = Math.min(canvas.width, canvas.height) * 0.09;
    const tilt = 0.12;
    for (let i = -1; i <= 1; i++) {
      stars.push({
        x: cx + i * gap,
        y: cy + i * gap * tilt,
        r: 2.2 * devicePixelRatio,
        p: Math.random() * Math.PI * 2,
        s: 0.5,
        belt: true
      });
    }
  }

  function draw(t) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const st of stars) {
      const a = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(t * 0.001 * st.s + st.p));
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      ctx.fillStyle = st.belt
        ? `rgba(200,168,96,${a})`
        : `rgba(200,184,154,${a * 0.7})`;
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }

  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
})();
</script>

</body>
</html>
